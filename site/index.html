<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tools and demos for exploring SIRI Situation Exchange data.">
  <title>SIRI-SX tools and demos</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #212529;
      background: #f5f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      padding: 3rem max(1.5rem, calc((100vw - 70rem) / 2));
      color: white;
      background: #343a40;
    }

    h1 { margin: 0 0 0.75rem; }
    header p { max-width: 48rem; margin: 0; color: #dee2e6; }

    main {
      width: min(70rem, calc(100% - 3rem));
      margin: 0 auto;
      padding: 3rem 0;
    }

    .card {
      display: block;
      max-width: 38rem;
      padding: 1.5rem;
      color: inherit;
      text-decoration: none;
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 0.75rem;
      box-shadow: 0 0.25rem 1rem rgb(33 37 41 / 8%);
    }

    .card:hover,
    .card:focus-visible {
      border-color: #0d6efd;
      box-shadow: 0 0.5rem 1.5rem rgb(13 110 253 / 15%);
    }

    .card h2 { margin: 0 0 0.75rem; }
    .card p { margin: 0 0 1rem; color: #6c757d; line-height: 1.55; }
    .open { color: #0d6efd; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>SIRI-SX tools and demos</h1>
    <p>Applications for exploring, validating, and visualising SIRI Situation Exchange data.</p>
  </header>
  <main>
    <a class="card" href="./monitor/setup">
      <h2>SIRI-SX Situation Monitor</h2>
      <p>
        Browse planned and unplanned situations, validity periods, passenger
        information, and affected transport objects.
      </p>
      <span class="open">Open monitor →</span>
    </a>
  </main>
</body>
</html>
